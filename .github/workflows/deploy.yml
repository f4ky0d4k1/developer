name: Deploy

on:
  push:
    branches: [ master ]
  workflow_dispatch:

env:
  DOCKER_IMAGE_DEV: ${{ secrets.DOCKER_USERNAME }}/developer
  DOCKER_IMAGE_OC: ${{ secrets.DOCKER_USERNAME }}/opencode-with-mcp
  DOCKER_IMAGE_ALLOY: ${{ secrets.DOCKER_USERNAME }}/grafana-alloy

jobs:
  build:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('pom.xml') }}
          restore-keys: maven-

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Package JAR (skip tests for now)
        run: ./mvnw package -DskipTests -T 1C
        env:
          MAVEN_OPTS: -Xmx4g

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push developer image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.DOCKER_IMAGE_DEV }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push opencode image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./opencode.Dockerfile
          push: true
          tags: ${{ env.DOCKER_IMAGE_OC }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push grafana-alloy image
        uses: docker/build-push-action@v5
        with:
          context: ./grafana-alloy
          file: ./grafana-alloy/Dockerfile
          push: true
          tags: ${{ env.DOCKER_IMAGE_ALLOY }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    name: Deploy to Production VPS
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    environment:
      name: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy deployment files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: ".deploy/docker-compose.prod.yml,.deploy/deploy.sh,.deploy/healthcheck.sh,docker-compose.yml"
          target: "/opt/developer"
          strip_components: 1
          overwrite: true

      - name: Copy opencode config to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "opencode-config/"
          target: "/opt/developer/opencode-config"
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DOCKER_USERNAME,DOCKER_PASSWORD
          script: |
            cd /opt/developer
            chmod +x deploy.sh healthcheck.sh
            ./deploy.sh
