# Production override — использует готовые образы из Docker Hub вместо локальной сборки
# Запуск: docker compose -f docker-compose.yml -f .deploy/docker-compose.prod.yml up -d
services:
  developer:
    image: f4ky0d4k/developer:main
    restart: always

  opencode:
    image: f4ky0d4k/opencode-with-mcp:main
    restart: always

  postgres:
    restart: always

  grafana-alloy:
    image: f4ky0d4k/grafana-alloy:main
    restart: always
