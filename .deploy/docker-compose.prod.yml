services:
  developer:
    image: f4ky0d4k/developer:main
    container_name: developer
    restart: always
    ports:
      - "8080:8080"
      - "8081:8081"
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - repo-data:/work
    depends_on:
      postgres:
        condition: service_healthy
      opencode:
        condition: service_started
    networks:
      - agent-net

  opencode:
    image: f4ky0d4k/opencode-with-mcp:main
    container_name: opencode
    working_dir: /work
    command: [ "serve", "--port", "4096", "--hostname", "0.0.0.0" ]
    restart: always
    volumes:
      - repo-data:/work
      - ./opencode-config/agents:/work/.opencode/agents
      - ./opencode-config/opencode.jsonc:/root/.config/opencode/opencode.jsonc
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      OPENCODE_EXPERIMENTAL: "1"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_TOKEN}
      GITHUB_TOOLSETS: "repos,issues,pull_requests"
      TRACKER_TOKEN: ${TRACKER_TOKEN}
      TRACKER_CLOUD_ORG_ID: ${TRACKER_CLOUD_ORG_ID}
      TRANSPORT: stdio
      GRAFANA_URL: ${GRAFANA_URL}
      GRAFANA_SERVICE_ACCOUNT_TOKEN: ${GRAFANA_SERVICE_ACCOUNT_TOKEN}
      UV_PYTHON: python3
    networks:
      - agent-net

  postgres:
    image: postgres:16
    container_name: developer-postgres
    restart: always
    environment:
      POSTGRES_DB: agent_state
      POSTGRES_USER: ${POSTGRES_USER:-developer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-developer}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-developer} -d agent_state" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agent-net

  grafana-alloy:
    image: f4ky0d4k/grafana-alloy:main
    container_name: grafana_alloy
    restart: always
    env_file:
      - .env
    depends_on:
      - developer
    networks:
      - agent-net

networks:
  agent-net:
    driver: bridge

volumes:
  pgdata:
  repo-data:
