# Production override — использует готовые образы из Docker Hub вместо локальной сборки
# Запуск: docker compose -f docker-compose.yml -f .deploy/docker-compose.prod.yml up -d
#
# Тег каждого сервиса — иммутабельный и меняется только при изменении ЕГО входов
# (DEVELOPER_TAG/OPENCODE_TAG/ALLOY_TAG передаёт deploy.sh из CI). Так compose пересоздаёт
# лишь изменившийся сервис. Мутабельный `master` кешируется pull-through-зеркалом Timeweb,
# поэтому он только fallback для ручного запуска.
services:
  developer:
    image: dockerhub.timeweb.cloud/f4ky0d4k/developer:${DEVELOPER_TAG:-master}
    restart: always

  opencode:
    image: dockerhub.timeweb.cloud/f4ky0d4k/opencode-with-mcp:${OPENCODE_TAG:-master}
    restart: always

  postgres:
    image: dockerhub.timeweb.cloud/library/postgres:18
    restart: always

  grafana-alloy:
    image: dockerhub.timeweb.cloud/f4ky0d4k/grafana-alloy:${ALLOY_TAG:-master}
    restart: always
